<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>A question for you 🌻</title>
<style>
  :root{
    --gold:#FDB813; --amber:#F4A300; --amber-deep:#E08900;
    --leaf:#4E8C4A; --ink:#4a3214; --cream:#FFF8EC; --red:#C0392B;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:"Georgia","Palatino Linotype","Book Antiqua",serif;
    color:var(--ink);
    background:
      radial-gradient(ellipse at 50% 0%, #FFF3D6 0%, rgba(255,243,214,0) 55%),
      linear-gradient(180deg,#FFE9C2 0%, #FFD79A 60%, #F4A300 100%);
    min-height:100%;
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    padding:1.2rem;
    -webkit-font-smoothing:antialiased;
    touch-action:manipulation;
  }

  .wrap{position:relative; z-index:2; max-width:620px; width:100%;}

  .eyebrow{
    font-size:clamp(.8rem,2.6vw,1rem); letter-spacing:.4em; text-transform:uppercase;
    color:var(--amber-deep); margin-bottom:1rem;
  }
  .devanagari{font-family:"Nirmala UI","Mangal","Noto Sans Devanagari",sans-serif;}

  .q{
    font-size:clamp(1.8rem,7vw,3.2rem);
    line-height:1.25; color:var(--red);
    background:linear-gradient(180deg,var(--amber),var(--red));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    margin-bottom:.4rem;
  }
  .q-hi{
    font-size:clamp(1.15rem,4.4vw,1.7rem);
    color:#7a3d10; margin-bottom:2.2rem;
  }

  /* the spinning sunflower above the question */
  .flower{
    width:clamp(90px,22vw,140px); height:clamp(90px,22vw,140px);
    margin:0 auto 1.4rem; display:block;
    animation:spin 18s linear infinite;
    filter:drop-shadow(0 10px 14px rgba(150,90,0,.3));
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .playarea{
    position:relative;
    display:flex; gap:1.1rem; justify-content:center; align-items:center;
    flex-wrap:wrap; min-height:90px;
  }
  .btn{
    font-family:inherit;
    font-size:clamp(1.1rem,4.5vw,1.5rem);
    font-weight:bold;
    padding:.7em 1.7em;
    border:none; border-radius:999px;
    cursor:pointer;
    transition:transform .18s ease, box-shadow .25s ease, left .25s cubic-bezier(.2,.8,.2,1), top .25s cubic-bezier(.2,.8,.2,1);
    will-change:transform;
  }
  #yes{
    color:#fff;
    background:linear-gradient(180deg,#5fb85a,var(--leaf));
    box-shadow:0 8px 18px rgba(78,140,74,.45);
    transform-origin:center;
    animation:pulse 1.8s ease-in-out infinite;
  }
  #yes:active{transform:scale(.96);}
  @keyframes pulse{0%,100%{box-shadow:0 8px 18px rgba(78,140,74,.45);}50%{box-shadow:0 8px 30px rgba(78,140,74,.75);}}
  #no{
    color:var(--amber-deep);
    background:#fff7e6;
    border:2px solid var(--amber);
    box-shadow:0 6px 14px rgba(176,110,0,.25);
  }

  .taunt{
    margin-top:1.8rem; min-height:1.6em;
    font-size:clamp(1rem,3.6vw,1.35rem);
    color:#8a4a14; font-style:italic;
    transition:opacity .2s ease;
  }

  /* ---------- WIN screen ---------- */
  #win{display:none;}
  #win.show{display:block; animation:fadeUp .9s ease both;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:none;}}
  .win-flower{width:clamp(120px,30vw,190px);height:clamp(120px,30vw,190px);margin:0 auto 1.2rem;display:block;
    animation:bloomPop 1s cubic-bezier(.2,.9,.2,1) both, spin 16s linear 1s infinite;
    filter:drop-shadow(0 14px 18px rgba(150,90,0,.35));}
  @keyframes bloomPop{from{transform:scale(.2) rotate(-30deg);opacity:0;}to{transform:scale(1) rotate(0);opacity:1;}}
  .win-title{font-size:clamp(2rem,8vw,3.4rem);color:var(--red);
    background:linear-gradient(180deg,var(--amber),var(--red));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.5rem;}
  .win-sub{font-size:clamp(1.1rem,4vw,1.6rem);color:#7a3d10;margin-bottom:.4rem;}
  .win-shayari{font-size:clamp(1rem,3.6vw,1.3rem);color:#8a4a14;font-style:italic;margin:1.2rem auto 0;max-width:24ch;line-height:1.7;}
  .win-by{margin-top:1.4rem;font-size:clamp(.95rem,3vw,1.2rem);color:#7a3d10;}
  .replay{margin-top:2rem;background:none;border:none;color:#a85e1c;font-family:inherit;
    font-size:.95rem;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;opacity:.8;}

  /* ---------- petals ---------- */
  #petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5;}
  .petal{position:absolute;top:-6vh;width:16px;height:20px;
    background:linear-gradient(160deg,#FFE08A,var(--gold) 55%,var(--amber));
    border-radius:90% 10% 90% 10% / 90% 10% 90% 10%;opacity:.9;}
  @keyframes fall{
    0%{transform:translate(0,-8vh) rotate(0);opacity:0;}
    10%{opacity:.95;}
    100%{transform:translate(var(--drift,40px),110vh) rotate(var(--spin,540deg));opacity:0;}
  }

  @media (prefers-reduced-motion: reduce){
    .flower,.win-flower{animation:none !important;}
    #petals{display:none;}
    .btn{transition:left .2s linear, top .2s linear;}
  }
</style>
</head>
<body>

<!-- reusable sunflower -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <radialGradient id="cg" cx="50%" cy="42%" r="60%">
    <stop offset="0%" stop-color="#8a5a2b"/><stop offset="55%" stop-color="#6b4423"/><stop offset="100%" stop-color="#43290f"/>
  </radialGradient>
  <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFE08A"/><stop offset="55%" stop-color="#FDB813"/><stop offset="100%" stop-color="#F4A300"/>
  </linearGradient>
  <symbol id="sf" viewBox="0 0 200 200">
    <g fill="url(#pg)">
      <g transform="rotate(0 100 100)"><ellipse cx="100" cy="48" rx="12" ry="36"/></g>
      <g transform="rotate(30 100 100)"><ellipse cx="100" cy="48" rx="12" ry="36"/></g>
      <g transform="rotate(60 100 100)"><ellipse cx="100" cy="48" rx="12" ry="36"/></g>
      <g transform="rotate(90 100 100)"><ellipse cx="100" cy="48" rx="12" ry="36"/></g>
      <g transform="rotate(120 100 100)"><ellipse cx="100" cy="48" rx="12" ry="36"/></g>
      <g transform="rotate(150 100 100)"><ellipse cx="100" cy="48" rx="12" ry="36"/></g>
      <g transform="rotate(180 100 100)"><ellipse cx="100" cy="48" rx="12" ry="36"/></g>
      <g transform="rotate(210 100 100)"><ellipse cx="100" cy="48" rx="12" ry="36"/></g>
      <g transform="rotate(240 100 100)"><ellipse cx="100" cy="48" rx="12" ry="36"/></g>
      <g transform="rotate(270 100 100)"><ellipse cx="100" cy="48" rx="12" ry="36"/></g>
      <g transform="rotate(300 100 100)"><ellipse cx="100" cy="48" rx="12" ry="36"/></g>
      <g transform="rotate(330 100 100)"><ellipse cx="100" cy="48" rx="12" ry="36"/></g>
    </g>
    <circle cx="100" cy="100" r="38" fill="url(#cg)"/>
    <circle cx="100" cy="100" r="38" fill="none" stroke="#caa14a" stroke-width="2.5" opacity=".5"/>
  </symbol>
</defs></svg>

<div class="wrap">

  <!-- QUESTION -->
  <div id="game">
    <svg class="flower"><use href="#sf" xlink:href="#sf"></use></svg>
    <div class="eyebrow">a tiny question, Kalash…</div>
    <h1 class="q">Do you love me?</h1>
    <p class="q-hi devanagari">क्या तुम मुझे प्यार करती हो? 🌻</p>

    <div class="playarea">
      <button id="yes" class="btn">Yes 💛</button>
      <button id="no"  class="btn">No</button>
    </div>

    <p class="taunt devanagari" id="taunt"></p>
  </div>

  <!-- WIN -->
  <div id="win">
    <svg class="win-flower"><use href="#sf" xlink:href="#sf"></use></svg>
    <h1 class="win-title">I knew it! 💛</h1>
    <p class="win-sub devanagari">मुझे पता था… मैं भी तुमसे उतना ही प्यार करता हूँ।</p>
    <p class="win-shayari devanagari">तेरा ज़िक्र आते ही ये दिल बाग़-बाग़ हो जाता है,<br>तू नहीं तो कुछ भी नहीं — तू है, तो सब कुछ मेरा है। 🌻</p>
    <p class="win-by devanagari">— हमेशा तुम्हारा, Ashish</p>
    <button class="replay" id="replay">↺ play again</button>
  </div>

</div>

<div id="petals" aria-hidden="true"></div>

<script>
(function(){
  "use strict";
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var coarse = window.matchMedia && window.matchMedia("(hover: none) and (pointer: coarse)").matches;

  var yes   = document.getElementById("yes");
  var no    = document.getElementById("no");
  var taunt = document.getElementById("taunt");
  var game  = document.getElementById("game");
  var win   = document.getElementById("win");
  var layer = document.getElementById("petals");

  var TAUNTS = [
    "",
    "सोच लो… फिर से 🙂",
    "सच में? 🥺",
    "अरे, वो वाला बटन तो काम ही नहीं करता 😄",
    "पकड़ के तो दिखाओ 😝",
    "इतनी कोशिश? बस 'हाँ' कह दो 🌻",
    "ना वाला रास्ता बंद है 💛",
    "तुम्हारे पास सिर्फ़ एक ही ऑप्शन है ❤️",
    "ठीक है… अब तो सिर्फ़ हाँ बचा है 😊"
  ];

  var dodges = 0;
  var roaming = false;

  function rand(min, max){ return min + Math.random() * (max - min); }

  function moveNo(){
    var w = no.offsetWidth, h = no.offsetHeight;
    var pad = 10;
    var maxX = Math.max(pad, window.innerWidth  - w - pad);
    var maxY = Math.max(pad, window.innerHeight - h - pad);

    // avoid landing on top of YES
    var yr = yes.getBoundingClientRect();
    var x, y, tries = 0;
    do {
      x = rand(pad, maxX);
      y = rand(pad, maxY);
      tries++;
      var cx = x + w/2, cy = y + h/2;
      var ycx = yr.left + yr.width/2, ycy = yr.top + yr.height/2;
      var far = Math.hypot(cx - ycx, cy - ycy) > 150;
    } while(!far && tries < 12);

    no.style.left = x + "px";
    no.style.top  = y + "px";
  }

  function escalate(){
    dodges++;
    // grow YES, shrink NO
    var ys = Math.min(2.2, 1 + dodges * 0.13);
    yes.style.transform = "scale(" + ys + ")";
    var ns = Math.max(0.5, 1 - dodges * 0.07);
    no.style.transform = "scale(" + ns + ")";

    taunt.textContent = TAUNTS[Math.min(dodges, TAUNTS.length - 1)];

    if (dodges >= 8){            // give up — only YES remains
      no.style.display = "none";
    }
  }

  var last = 0;
  function dodge(e){
    if (e){ e.preventDefault(); }       // cancels the tap/click even if throttled below
    var now = Date.now();
    if (now - last < 180) return;       // throttle: chasing shouldn't insta-max the game
    last = now;
    if (!roaming){
      roaming = true;
      no.style.position = "fixed";
      no.style.margin = "0";
    }
    moveNo();
    escalate();
  }

  // touch + click + pen: intercept the press so the tap never lands
  no.addEventListener("pointerdown", dodge);
  no.addEventListener("pointerenter", dodge);   // desktop hover flee
  no.addEventListener("click", function(e){ e.preventDefault(); });

  // desktop: flee when the cursor merely gets close (only where hover exists)
  if (!coarse){
    document.addEventListener("mousemove", function(e){
      if (no.style.display === "none") return;
      var r = no.getBoundingClientRect();
      var d = Math.hypot(e.clientX - (r.left + r.width/2), e.clientY - (r.top + r.height/2));
      if (d < 110) dodge();
    });
  }

  /* ---------- petals ---------- */
  var COLORS = [
    "linear-gradient(160deg,#FFE08A,#FDB813 55%,#F4A300)",
    "linear-gradient(160deg,#FFD24A,#F4A300 60%,#E08900)"
  ];
  function petal(fromTop){
    var p = document.createElement("div");
    p.className = "petal";
    var size = 10 + Math.random()*14, dur = 6 + Math.random()*6;
    p.style.left = (Math.random()*100) + "vw";
    p.style.width = size + "px"; p.style.height = (size*1.25) + "px";
    p.style.background = COLORS[(Math.random()*COLORS.length)|0];
    p.style.setProperty("--drift", (Math.random()*200-100)+"px");
    p.style.setProperty("--spin", ((360+Math.random()*540)*(Math.random()<.5?-1:1))+"deg");
    p.style.animation = "fall " + dur + "s linear " + (fromTop?"0s":(Math.random()*-dur)+"s") + " forwards";
    layer.appendChild(p);
    p.addEventListener("animationend", function(){ p.remove(); });
  }
  function burst(n){ for(var i=0;i<n;i++) petal(true); }

  var ambient = null;
  if (!reduce){
    var seed = coarse ? 5 : 10;
    for (var k=0;k<seed;k++) petal(false);
    ambient = setInterval(function(){
      if (document.hidden) return;
      if (layer.childElementCount < (coarse?14:36)) petal(true);
    }, coarse ? 1500 : 850);
  }

  /* ---------- WIN ---------- */
  yes.addEventListener("click", function(){
    game.style.display = "none";
    win.classList.add("show");
    if (!reduce) burst(coarse ? 40 : 80);
  });

  document.getElementById("replay").addEventListener("click", function(){
    dodges = 0; roaming = false; last = 0;
    yes.style.transform = "scale(1)";
    no.style.cssText = "";          // reset position/scale/display
    taunt.textContent = "";
    win.classList.remove("show");
    game.style.display = "";
  });
})();
</script>
</body>
</html>
